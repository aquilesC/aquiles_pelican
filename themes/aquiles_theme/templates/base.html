<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="generator" content="Pelican" />
  
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  
  {% block meta %}
  <meta name="description" content="{% block description %}{{ SITESUBTITLE }}{% endblock %}" />
  {% endblock %}
  
  <!-- Preload core variable fonts for fast, visually stable typography -->
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
  
  <!-- Feeds -->
  {% if FEED_ALL_RSS %}
  <link rel="alternate" type="application/rss+xml" title="{{ SITENAME }} - RSS Feed" href="{{ SITEURL }}/{{ FEED_ALL_RSS }}" />
  {% endif %}

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BBEN060376"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BBEN060376');
  </script>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-background text-text-primary">
  <a href="#main" class="skip-link">Skip to main content</a>

  {% include 'includes/header.html' %}
  
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  
  {% include 'includes/footer.html' %}
  
  {% block extra_scripts %}{% endblock %}
</body>
</html>
