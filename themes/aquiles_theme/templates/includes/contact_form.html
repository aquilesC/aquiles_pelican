{% from 'includes/icons.html' import icon %}

<form id="contact-form" action="https://formspree.io/f/xqawzylw" method="POST" class="space-y-md">
  <!-- Name -->
  <div>
    <label for="name" class="block text-meta font-medium mb-xs text-text-primary">
      Name <span class="text-accent" aria-hidden="true">*</span>
    </label>
    <input 
      type="text" 
      id="name" 
      name="name" 
      required
      class="field"
      placeholder="Dr. Jane Doe"
      minlength="2"
      autocomplete="name"
    />
  </div>

  <!-- Email -->
  <div>
    <label for="email" class="block text-meta font-medium mb-xs text-text-primary">
      Email <span class="text-accent" aria-hidden="true">*</span>
    </label>
    <input 
      type="email" 
      id="email" 
      name="email" 
      required
      class="field"
      placeholder="jane@example.com"
      autocomplete="email"
    />
  </div>

  <!-- Subject -->
  <div>
    <label for="subject" class="block text-meta font-medium mb-xs text-text-primary">
      Subject <span class="text-accent" aria-hidden="true">*</span>
    </label>
    <input 
      type="text" 
      id="subject" 
      name="subject" 
      required
      class="field"
      placeholder="Advisory / Deep Tech Spinout / Consultation"
      minlength="3"
    />
  </div>

  <!-- Message -->
  <div>
    <label for="message" class="block text-meta font-medium mb-xs text-text-primary">
      Message <span class="text-accent" aria-hidden="true">*</span>
    </label>
    <textarea 
      id="message" 
      name="message" 
      required
      rows="5"
      class="field resize-y"
      placeholder="Tell me a bit about your research, venture, or challenge..."
      minlength="10"
    ></textarea>
  </div>

  <!-- Submit Button -->
  <div class="pt-sm">
    <button type="submit" class="btn btn-primary w-full sm:w-auto">
      <span>Send Message</span>
      {{ icon('arrow-right', 'icon icon-arrow') }}
    </button>
  </div>

  <p id="contact-form-status" class="text-meta text-text-secondary mt-sm" role="status" aria-live="polite"></p>
</form>
